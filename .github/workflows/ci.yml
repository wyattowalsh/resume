name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    name: Build, lint, test, and artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build scripts
        run: pnpm build:script

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Generate resume artifacts
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node src/scripts/generate.js

      - name: Check artifact regressions
        run: node src/scripts/check-artifacts.js

      - name: Upload generated resume artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-artifacts
          path: |
            assets/outputs/resume-full.pdf
            assets/outputs/resume-full.png
            assets/outputs/resume-single.pdf
            assets/outputs/resume-single.png

      - name: Verify tracked files remain clean
        run: git diff --exit-code
