name: CI

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, test, and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: |
            pnpm-lock.yaml
            docs/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install docs dependencies
        run: pnpm -C docs install --frozen-lockfile

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Build scripts
        run: pnpm build:script

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build docs
        run: pnpm check:docs

      - name: Install Puppeteer Chrome
        run: pnpm exec puppeteer browsers install chrome

      - name: Generate, sync, and check resume artifacts
        run: pnpm check:artifacts

      - name: Upload generated resume artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resume-artifacts
          path: |
            assets/outputs/resume-full.pdf
            assets/outputs/resume-full.docx
            assets/outputs/resume-full.png
            assets/outputs/resume-single.pdf
            assets/outputs/resume-single.docx
            assets/outputs/resume-single.png

      - name: Verify tracked files remain clean
        run: >-
          git diff --exit-code -- .
          ':!public/downloads/wyatt-walsh-resume-full.pdf'
          ':!public/downloads/wyatt-walsh-resume-full.docx'
          ':!public/downloads/wyatt-walsh-resume-single.pdf'
          ':!public/downloads/wyatt-walsh-resume-single.docx'
