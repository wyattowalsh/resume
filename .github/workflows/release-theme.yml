name: Release Theme

on:
  release:
    types: [published]

jobs:
  build_and_release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        working-directory: ./themes/jsonresume-theme-w
        run: pnpm install

      - name: Install resume-cli
        run: pnpm add -g resume-cli

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Export HTML
        working-directory: ./themes/jsonresume-theme-w
        run: resume export resume.html --theme .

      - name: Export PDF
        working-directory: ./themes/jsonresume-theme-w
        run: resume export resume.pdf --theme .

      - name: Convert PDF to PNG
        working-directory: ./themes/jsonresume-theme-w
        run: |
          convert -density 300 resume.pdf -quality 100 -background white -alpha remove resume.png

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            ./themes/jsonresume-theme-w/resume.html \
            ./themes/jsonresume-theme-w/resume.pdf \
            ./themes/jsonresume-theme-w/resume.png 