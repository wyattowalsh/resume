name: Release Resume

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Optional release tag to upload generated artifacts to
        required: false
        type: string
  release:
    types: [published]

concurrency:
  group: release-resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_release:
    name: Build and Release Resume
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Build scripts
        run: pnpm build:script

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Install Puppeteer Chrome
        run: pnpm exec puppeteer browsers install chrome

      - name: Generate resume artifacts
        run: node src/scripts/generate.js

      - name: Check artifact regressions
        run: node src/scripts/check-artifacts.js

      - name: Create checksum manifest
        run: |
          sha256sum \
            assets/outputs/resume-full.pdf \
            assets/outputs/resume-full.docx \
            assets/outputs/resume-full.png \
            assets/outputs/resume-single.pdf \
            assets/outputs/resume-single.docx \
            assets/outputs/resume-single.png \
            > assets/outputs/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume-release-artifacts
          path: |
            assets/outputs/resume-full.pdf
            assets/outputs/resume-full.docx
            assets/outputs/resume-full.png
            assets/outputs/resume-single.pdf
            assets/outputs/resume-single.docx
            assets/outputs/resume-single.png
            assets/outputs/SHA256SUMS.txt

      - name: Resolve release tag
        id: release-tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            printf 'tag_name=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload assets to release
        if: steps.release-tag.outputs.tag_name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            assets/outputs/resume-full.pdf \
            assets/outputs/resume-full.docx \
            assets/outputs/resume-full.png \
            assets/outputs/resume-single.pdf \
            assets/outputs/resume-single.docx \
            assets/outputs/resume-single.png \
            assets/outputs/SHA256SUMS.txt \
            --clobber
